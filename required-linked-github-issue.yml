name: Require linked GitHub issue

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: read
  issues: write

concurrency:
  group: require-linked-github-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-linked-issue:
    name: Require linked GitHub issue
    runs-on: ubuntu-slim
    steps:
      - name: Validate linked issue
        uses: JoostVoskuil/github-actions-pr-traceable-to-work@main
        with:
          provider: github