name: Build, Package, and Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, package, and test action
        run: |
          npm run clean
          npm run ci

      - name: Determine release type
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request_numbers=$(gh api \
            --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | select(.merged_at != null) | .number')

          if [[ -z "$pull_request_numbers" ]]; then
            echo "No merged pull request is associated with ${GITHUB_SHA}; skipping release."
            echo "release_type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t pull_requests <<< "$pull_request_numbers"

          if [[ ${#pull_requests[@]} -ne 1 ]]; then
            echo "Expected one merged pull request for ${GITHUB_SHA}, found ${#pull_requests[@]}." >&2
            exit 1
          fi

          PULL_REQUEST=${pull_requests[0]}
          release_label_names=$(gh pr view "$PULL_REQUEST" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '.labels[].name | select(test("^release:(patch|minor|major)$"))')

          if [[ -z "$release_label_names" ]]; then
            echo "Pull request #${PULL_REQUEST} has no release label; skipping release."
            echo "release_type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t release_labels <<< "$release_label_names"

          if [[ ${#release_labels[@]} -ne 1 ]]; then
            echo "Pull request #${PULL_REQUEST} must have exactly one of release:patch, release:minor, or release:major." >&2
            exit 1
          fi

          RELEASE_TYPE=${release_labels[0]#release:}
          SEMVER_COMPONENT='(0|[1-9][0-9]*)'
          STABLE_SEMVER="${SEMVER_COMPONENT}\\.${SEMVER_COMPONENT}\\.${SEMVER_COMPONENT}"
          git fetch --force --tags origin
          mapfile -t tags < <(git tag --list 'v*' | grep -E "^v${STABLE_SEMVER}$" | sort --version-sort || true)

          if [[ ${#tags[@]} -eq 0 ]]; then
            LATEST_VERSION='0.0.0'
          else
            LATEST_VERSION=${tags[${#tags[@]} - 1]#v}
          fi

          IFS=. read -r major minor patch <<< "$LATEST_VERSION"
          case "$RELEASE_TYPE" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
          esac

          TAG="v${major}.${minor}.${patch}"
          echo "Pull request #${PULL_REQUEST} requests a ${RELEASE_TYPE} release: ${LATEST_VERSION} -> ${TAG#v}"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit packaged action
        run: |
          if git diff --quiet -- dist/; then
            echo "Packaged action is already up to date."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/
          git commit --message "build: package action"
          git push origin HEAD:main

      - name: Create semver tag and GitHub release
        if: steps.version.outputs.release_type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git ls-remote --exit-code --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag --annotate "${TAG}" --message "Release ${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG}"
